[package]
name = "ButterflyAPI"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = "symbols"
debug = false
lto = "thin"
codegen-units = 1

[dependencies]
kube = { version = "3.1.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"] }
schemars = { version = "1" }
argon2 = "0.5.3"
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.136.0"
axum = {version = "0.8.9", features = ["macros", "ws"]}
bb8 = "0.9.1"
bytes = "1.11.1"
constcat = "0.6.1"
diesel = {version = "2.3.10", features = ["postgres", "uuid", "ipnet-address"] }
diesel-async = { version = "0.9.1", features = ["postgres", "bb8", "pool"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
hex = "0.4.3"
lettre = "0.11.22"
lettre_email = "0.9.4"
rand_core = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.18"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.3", features = ["v4", "serde"]}
rand = "0.10.1"
serde_json = "1.0.150"
aws-lc-rs = "1.17.0"
rustls = "0.23.40"
ipnet = "2.12.0"
moka = { version = "0.12.15", features = ["future"] }
