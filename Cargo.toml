[package]
name = "ButterflyAPI"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = "symbols"
debug = false
lto = "thin"
codegen-units = 1

[dependencies]
kube = { version = "5.1.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
argon2 = "0.6.0"
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.161.0"
axum = {version = "0.8.9", features = ["macros", "ws"]}
bb8 = "0.9.1"
bytes = "1.12.2"
constcat = "0.6.1"
diesel = {version = "2.4.0", features = ["postgres", "chrono", "without-deprecated", "uuid", "ipnet-address"] }
diesel-async = { version = "0.10.0", features = ["postgres", "bb8", "pool"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
lettre = "0.11.24"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.20"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4", "serde"]}
rand = "0.10.4"
serde_json = "1.0.154"
aws-lc-rs = "1.19.0"
rustls = "0.23.46"
ipnet = "2.12.2"
moka = { version = "0.12.16", features = ["future"] }
time = "0.3.55"
chrono = { version = "0.4.45", features = ["serde"]}
strum = "0.28.0"
strum_macros = "0.28.0"
